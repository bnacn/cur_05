<svg viewBox="0 0 200 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tiempo objetivo de recuperación (RTO)">
  <rect width="200" height="160" rx="16" fill="#0F2C4C"/>
  <circle cx="100" cy="86" r="46" fill="#173D64" stroke="#3E7FC4" stroke-width="2.5"/>
  <circle cx="100" cy="86" r="38" fill="none" stroke="#2B6CB0" stroke-width="1.4" stroke-dasharray="3 5"/>
  <!-- tick marks -->
  <g stroke="#8FB6E0" stroke-width="2" stroke-linecap="round">
    <line x1="100" y1="44" x2="100" y2="50"/>
    <line x1="142" y1="86" x2="136" y2="86"/>
    <line x1="100" y1="128" x2="100" y2="122"/>
    <line x1="58" y1="86" x2="64" y2="86"/>
  </g>
  <!-- clock hands: minute pointing to target -->
  <line x1="100" y1="86" x2="100" y2="56" stroke="#E7F0FA" stroke-width="3" stroke-linecap="round"/>
  <line x1="100" y1="86" x2="124" y2="86" stroke="#C79A3D" stroke-width="4" stroke-linecap="round"/>
  <circle cx="100" cy="86" r="4.5" fill="#C79A3D"/>
  <!-- crown -->
  <rect x="96" y="34" width="8" height="8" rx="2" fill="#3E7FC4"/>
  <!-- top buttons -->
  <rect x="76" y="30" width="10" height="6" rx="2" fill="#3E7FC4" transform="rotate(-30 81 33)"/>
  <rect x="114" y="30" width="10" height="6" rx="2" fill="#3E7FC4" transform="rotate(30 119 33)"/>

  <text x="100" y="145" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10" fill="#8FB6E0" letter-spacing=".5">RTO · TIEMPO OBJETIVO</text>
</svg>
