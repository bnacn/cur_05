<svg viewBox="0 0 200 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Estrategia de continuidad: derivar a canales digitales">
  <rect width="200" height="160" rx="16" fill="#0F2C4C"/>

  <!-- blocked branch (left) -->
  <g transform="translate(24,50)">
    <rect x="0" y="18" width="46" height="34" fill="#173D64"/>
    <rect x="0" y="18" width="46" height="6" fill="#C79A3D"/>
    <rect x="6" y="26" width="6" height="26" fill="#0F2C4C"/>
    <rect x="18" y="26" width="10" height="26" fill="#0F2C4C"/>
    <rect x="34" y="26" width="6" height="26" fill="#0F2C4C"/>
    <!-- blocked slash -->
    <circle cx="23" cy="35" r="27" fill="none" stroke="#AD4A32" stroke-width="3"/>
    <line x1="4" y1="16" x2="42" y2="54" stroke="#AD4A32" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- arrow -->
  <path d="M84 86h30 M104 78l10 8-10 8" stroke="#C79A3D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- mobile device (right) -->
  <g transform="translate(132,44)">
    <rect x="0" y="0" width="40" height="70" rx="7" fill="#173D64" stroke="#3E7FC4" stroke-width="2"/>
    <rect x="6" y="10" width="28" height="42" rx="2" fill="#0A2036"/>
    <circle cx="20" cy="61" r="3.4" fill="#3E7FC4"/>
    <!-- signal bars -->
    <g fill="#C79A3D">
      <rect x="10" y="34" width="4" height="10"/>
      <rect x="16" y="28" width="4" height="16"/>
      <rect x="22" y="22" width="4" height="22"/>
    </g>
  </g>

  <text x="100" y="140" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10" fill="#8FB6E0" letter-spacing=".5">CANALES DIGITALES</text>
</svg>
